AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SDIMS - Internal Management System

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.13
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        LOG_LEVEL: INFO
        STAGE: !Ref Stage
        TABLE_NAME: !Ref SDIMSTable
  Api:
    Cors:
      AllowMethods: "'*'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

# Parameters
Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment stage
    
  DynamoDBReadCapacityUnits:
    Type: Number
    Default: 5
    Description: Read capacity units cho DynamoDB table
    
  DynamoDBWriteCapacityUnits:
    Type: Number
    Default: 5
    Description: Write capacity units cho DynamoDB table
    
  DynamoDBGSIReadCapacityUnits:
    Type: Number
    Default: 5
    Description: Read capacity units cho Global Secondary Indexes
    
  DynamoDBGSIWriteCapacityUnits:
    Type: Number
    Default: 5
    Description: Write capacity units cho Global Secondary Indexes
    
  WebsiteDomainName:
    Type: String
    Default: "example.com"
    Description: Domain name của frontend website
    
  JWTSecret:
    Type: String
    Default: "temporary_secret_key_replace_in_production"
    Description: Secret key for signing JWT tokens
    NoEcho: true

  CertificateArn:
    Type: String
    Default: ""
    Description: ARN of the SSL certificate for custom domain (optional)

# Resources
Resources:
  # API Gateway
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      EndpointConfiguration: REGIONAL
      TracingEnabled: true
      
  # Lambda Layers
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: src/layers/commonLayer/
      CompatibleRuntimes:
        - python3.13
      LayerName: sdims-common-layer
      Description: Common utilities, models, and errors for SDIMS
  
  RepositoryLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: src/layers/repositorylayer/
      CompatibleRuntimes:
        - python3.13
      LayerName: sdims-repository-layer
      Description: DynamoDB repository layer for SDIMS
  
  ServiceLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: src/layers/serviceLayer/
      CompatibleRuntimes:
        - python3.13
      LayerName: sdims-service-layer
      Description: Service layer for SDIMS business logic

  # Lambda Functions - Auth
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/auth/
      Handler: login.lambda_handler
      Layers:
        - !Ref CommonLayer
        - !Ref RepositoryLayer
        - !Ref ServiceLayer
      Environment:
        Variables:
          JWT_SECRET: !Ref JWTSecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SDIMSTable
        - DynamoDBWritePolicy:
            TableName: !Ref SDIMSTable
      Events:
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/login
            Method: post

  # DynamoDB Table
  SDIMSTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "SDIMS_Main_${Stage}"
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: !Ref DynamoDBReadCapacityUnits
        WriteCapacityUnits: !Ref DynamoDBWriteCapacityUnits
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: !Ref DynamoDBGSIReadCapacityUnits
            WriteCapacityUnits: !Ref DynamoDBGSIWriteCapacityUnits
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: !Ref DynamoDBGSIReadCapacityUnits
            WriteCapacityUnits: !Ref DynamoDBGSIWriteCapacityUnits
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: !Ref DynamoDBGSIReadCapacityUnits
            WriteCapacityUnits: !Ref DynamoDBGSIWriteCapacityUnits

# Outputs để export các giá trị cần thiết
Outputs:
  ApiUrl:
    Description: URL của API
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  
  LoginApi:
    Description: API đăng nhập
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/v1/auth/login"
  